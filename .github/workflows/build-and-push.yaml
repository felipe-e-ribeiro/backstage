name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # Build "no host" (amd64 nativo): o resultado é JS puro, não depende de
      # arquitetura. Só o Dockerfile roda sob QEMU, e ele só instala as deps
      # de produção -- o mínimo possível emulado.
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn build:backend

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Nodes do oks-personal são arm64 (Ampere); runner é amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/backstage:${{ steps.tag.outputs.sha }}

      # values.yaml mora no backstage-infra. PAT fine-grained com escrita SÓ
      # nesse repo (BACKSTAGE_INFRA_PAT) -- mesmo padrão do PULSE_INFRA_PAT.
      - name: Checkout backstage-infra
        uses: actions/checkout@v4
        with:
          repository: felipe-e-ribeiro/backstage-infra
          token: ${{ secrets.BACKSTAGE_INFRA_PAT }}
          path: backstage-infra

      - name: Bump image tag no backstage-infra
        uses: mikefarah/yq@v4
        with:
          cmd: yq -i '.platform-chart.api.image.tag = "${{ steps.tag.outputs.sha }}"' backstage-infra/values.yaml

      - name: Commit e push no backstage-infra
        working-directory: backstage-infra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          git diff --cached --quiet || git commit -m "chore: bump backstage image to ${{ steps.tag.outputs.sha }}"
          git push
