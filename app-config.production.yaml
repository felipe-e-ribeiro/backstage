# Produção: oks-personal, via backstage-infra (platform-chart) + ArgoCD.
# Todo valor ${...} vem do Secret "backstage-secrets" (ExternalSecret <- OCI
# Vault "backstage-app-secrets"); nada sensível fica na imagem.

app:
  baseUrl: https://backstage.felipeduribeiro.com.br

backend:
  baseUrl: https://backstage.felipeduribeiro.com.br
  listen: ':7007'
  cors:
    origin: https://backstage.felipeduribeiro.com.br
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    # Um único banco "backstage" (role dona dele, sem CREATEDB) no Postgres
    # compartilhado comprasweb-postgres.comprasweb, com um schema por plugin
    # em vez do default de um banco por plugin.
    pluginDivisionMode: schema
    ensureExists: false
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: backstage
    knexConfig:
      pool:
        min: 0
        max: 5

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # Só entra quem tiver um User com o mesmo nome do login do
            # GitHub no catálogo (catalog/org.yaml) -- ou seja, só o dono.
            - resolver: usernameMatchingUserEntityName

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

catalog:
  locations:
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [User, Group, System]
    - type: file
      target: ./catalog/templates/new-app-infra/template.yaml
      rules:
        - allow: [Template]
    # <app>-infra existentes. Os criados pelo template se registram sozinhos
    # (catalog:register), não precisam entrar aqui.
    - type: url
      target: https://github.com/felipe-e-ribeiro/backstage-infra/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/felipe-e-ribeiro/pulse-infra/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/felipe-e-ribeiro/checklist-compras-infra/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/felipe-e-ribeiro/dashboard-cloud-infra/blob/main/catalog-info.yaml
